    <style>
        body {
            background-color: var(--color-bg);
            padding-top: 176px;
        }

        /* === Gallery Container === */
        .gallery-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 104px 80px;
        }

        /* === Intro === */
        .gallery-intro {
            margin-bottom: 56px;
            max-width: 520px;
        }

        .gallery-intro h1 {
            font-size: 45px;
            font-weight: 400;
            line-height: 1.15;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            color: var(--color-dark);
        }

        .gallery-intro p {
            font-size: 16px;
            line-height: 1.55;
            color: var(--color-dark);
            opacity: 0.85;
        }

        /* === Masonry Grid === */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 296px;
            gap: 20px;
        }

        /* === Card === */
        .gallery-card {
            position: relative;
            border-radius: 11px;
            overflow: hidden;
            background-color: #d4d4d4;
            cursor: pointer;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .card-corner {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 66px;
            height: 66px;
            background-image: url('reference/Ux/кутик w 66 h66.png');
            background-repeat: no-repeat;
            background-size: 66px 66px;
            z-index: 1;
            pointer-events: none;
        }

        .gallery-card:hover, .gallery-card.show-overlay {
            transform: translateY(-4px);
            box-shadow: 0 0 30px rgba(221, 92, 0, 0.25);
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        /* Full card link */
        .gallery-card-link {
            position: absolute;
            inset: 0;
            z-index: 2;
        }

        /* Hover Frame Effect */
        .gallery-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 5;
            pointer-events: none;
        }

        .gallery-card:hover::before, .gallery-card.show-overlay::before {
            opacity: 1;
        }

        .gallery-card--short::before {
            background-image: url('assets/Gallery hover 296x296 (orange).png');
        }

        .gallery-card--tall::before {
            background-image: url('assets/Gallery hover 608x608(orange).png');
        }

        /* --- Span modifiers --- */
        .gallery-card--short {
            grid-row: span 1;
        }

        .gallery-card--tall {
            grid-row: span 2;
        }

/* === Gradient overlay on cards for contrast === */
.gallery-card::after {
    content: 'see the product';
    position: absolute;
    inset: 0;
    background-color: rgba(221, 92, 0, 0.5); /* #DD5C00 with 50% opacity */
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: 400;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 4;
    border-radius: 11px;
    pointer-events: none;
}

.gallery-card:hover::after, .gallery-card.show-overlay::after {
    opacity: 1;
}

 /* Footer */
 /* === Footer override: contact row for this page === */
    .footer-bottom {
        flex-direction: column;
        align-items: flex-start;
        gap: 30px;
    }

        .footer-contact-row {
            display: flex;
            gap: 50px;
        }

 /* === Responsive === */
        @media (max-width: 1024px) {
            .gallery-container {
                padding: 0 50px 50px;
            }
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-auto-rows: 296px;
            }
        }

        @media (max-width: 768px) {
            body { padding-top: 120px; }
            .gallery-container {
                padding: 0 24px 60px;
            }
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: calc((100vw - 48px - 12px) / 2); /* Square-like calculation */
                gap: 12px;
            }
            .gallery-intro { margin-bottom: 30px; }
            .gallery-intro h1 {
                font-size: 32px !important;
                white-space: normal !important;
            }
            .card-corner {
                width: 40px !important;
                height: 40px !important;
                background-size: 40px 40px !important;
                z-index: 20 !important;
                display: block !important;
            }
        }
